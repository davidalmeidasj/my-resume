<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG image</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Rendered at exactly 1200x630, the size every social crawler crops to. */
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 26px;
        padding: 0 84px;
        font-family: 'Inter', system-ui, sans-serif;
        background: #4b5320;
        background-image:
          radial-gradient(circle at 88% 12%, rgba(255, 255, 255, 0.13), transparent 46%),
          radial-gradient(circle at 4% 94%, rgba(0, 0, 0, 0.24), transparent 52%);
        color: #ffffff;
        overflow: hidden;
      }
      .tag {
        font-size: 21px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #cdd8a6;
      }
      h1 {
        font-size: 90px;
        font-weight: 800;
        letter-spacing: -0.032em;
        line-height: 1;
      }
      .role {
        font-size: 37px;
        font-weight: 600;
        color: #e8eed6;
        letter-spacing: -0.01em;
      }
      .stack {
        display: flex;
        flex-wrap: wrap;
        gap: 11px;
        margin-top: 8px;
      }
      .stack span {
        font-size: 21px;
        font-weight: 600;
        padding: 9px 17px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.13);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .foot {
        position: absolute;
        bottom: 54px;
        left: 84px;
        right: 84px;
        display: flex;
        justify-content: space-between;
        font-size: 22px;
        color: #c3cf99;
        border-top: 1px solid rgba(255, 255, 255, 0.18);
        padding-top: 22px;
      }
    </style>
  </head>
  <body>
    <div class="tag">Rio de Janeiro, Brazil &nbsp;&middot;&nbsp; 100% Remote</div>
    <h1>David Almeida</h1>
    <div class="role">Senior Full Stack Developer &nbsp;&middot;&nbsp; 11+ years</div>
    <div class="stack">
      <span>TypeScript</span>
      <span>React</span>
      <span>Next.js</span>
      <span>Node.js</span>
      <span>NestJS</span>
      <span>PostgreSQL</span>
      <span>AWS</span>
    </div>
    <div class="foot">
      <span>linkedin.com/in/david-almeida-sj</span>
      <span>github.com/davidalmeidasj</span>
    </div>
  </body>
</html>
